<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charter Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top" hidden><div class="wrap">
  <div class="toprow">
    <div class="brand"><small id="vaName"></small><b id="coName"></b></div>
    <div class="gauges">
      <div class="gauge cash"><label>Balance</label><span id="gCash"></span></div>
      <div class="gauge"><label>Reputation</label><span id="gRep"></span><div class="repbar"><i id="gRepBar"></i></div></div>
      <div class="gauge"><label>Local time</label><span id="gClock"></span></div>
      <button class="iconbtn" id="soundBtn" data-act="sound" type="button">Ringer off</button>
      <button class="iconbtn" data-act="signout" type="button">Sign out</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div id="call"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
