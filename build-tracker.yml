name: Build tracker

on:
  push:
    paths: ['tracker/**', '.github/workflows/build-tracker.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: >
          dotnet publish tracker/CharterDeskTracker.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: CharterDeskTracker
          path: out/CharterDeskTracker.exe
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tracker-latest
          name: Charter Desk Tracker (latest)
          prerelease: false
          make_latest: true
          files: out/CharterDeskTracker.exe
